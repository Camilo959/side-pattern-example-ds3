<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Tienda — Sidecar Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #08090a;
      --panel: #0e0e11;
      --panel-2: #14161b;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f7f8f8;
      --text-2: #8a8f98;
      --accent: #5e6ad2;
      --accent-text: #9aa3f5;
      --green: #4cc38a;
      --red: #ff6369;
      --orange: #f5a524;
      --font: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.5; letter-spacing: -0.01em; min-height: 100vh; -webkit-font-smoothing: antialiased; padding-bottom: 56px; }
    body::before {
      content: ""; position: fixed; inset: 0 0 auto 0; height: 420px; pointer-events: none;
      background: radial-gradient(640px 280px at 50% -120px, rgba(94, 106, 210, 0.15), transparent 70%);
    }
    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(8, 9, 10, 0.72);
      -webkit-backdrop-filter: blur(16px) saturate(160%);
      backdrop-filter: blur(16px) saturate(160%);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; gap: 12px;
    }
    .logo { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; }
    .logo-icon { background: #f7f8f8; color: #08090a; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex: none; }
    .nav-link-btn {
      color: #08090a; background: #f7f8f8; text-decoration: none;
      font-size: 13px; font-weight: 500; padding: 0 14px; min-height: 32px;
      border-radius: 6px; display: inline-flex; align-items: center; border: 1px solid rgba(255,255,255,0.1);
    }
    .nav-link-btn:hover { filter: brightness(0.92); }
    .hero { padding: 56px 24px 8px; max-width: 1024px; margin: 0 auto; position: relative; }
    .hero .eyebrow { font-size: 13px; font-weight: 500; color: var(--text-2); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .hero .eyebrow::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px rgba(94,106,210,0.9); }
    .hero h1 { font-size: 40px; line-height: 1.1; font-weight: 600; letter-spacing: -0.03em; margin-bottom: 12px; }
    .hero p { color: var(--text-2); font-size: 15px; max-width: 600px; }
    .mode-banner {
      max-width: 976px; margin: 24px auto; padding: 10px 10px 10px 16px;
      background: linear-gradient(180deg, rgba(255,255,255,0.025), transparent 40%), var(--panel);
      border: 1px solid var(--border); border-radius: 10px;
      display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    .mode-info { display: flex; align-items: center; gap: 10px; font-size: 13.5px; flex-wrap: wrap; }
    .mode-info > span:first-child { color: var(--text-2); }
    .badge-proxy {
      background: rgba(76, 195, 138, 0.1); color: var(--green);
      border: 1px solid rgba(76, 195, 138, 0.3);
      padding: 3px 10px; border-radius: 999px; font-weight: 500; font-size: 12px; font-family: var(--mono);
      display: inline-flex; align-items: center; gap: 6px;
    }
    .badge-proxy::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .switch-mode-btn {
      background: rgba(255,255,255,0.04); border: 1px solid var(--border); color: var(--text);
      padding: 0 12px; min-height: 32px; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; font-family: var(--font);
    }
    .switch-mode-btn:hover { background: rgba(255,255,255,0.08); }
    .container { max-width: 1024px; margin: 0 auto; padding: 0 24px 24px; position: relative; }
    .catalog-title { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; padding: 16px 0 12px; }
    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .product-card {
      background: linear-gradient(180deg, rgba(255,255,255,0.025), transparent 35%), var(--panel);
      border: 1px solid var(--border); border-radius: 10px; padding: 14px;
      display: flex; flex-direction: column; justify-content: space-between; gap: 10px;
      transition: border-color 0.15s, background 0.15s;
    }
    .product-card:hover { border-color: rgba(255,255,255,0.16); background: var(--panel-2); }
    .product-emoji { font-size: 32px; text-align: center; background: rgba(255,255,255,0.03); border: 1px solid var(--border); padding: 18px; border-radius: 8px; }
    .product-name { font-weight: 600; font-size: 14px; letter-spacing: -0.01em; }
    .product-price { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; margin: 2px 0; }
    .product-stock { font-size: 12.5px; color: var(--text-2); margin-bottom: 4px; }
    .card-actions { display: flex; gap: 8px; align-items: center; }
    .quantity-select { background: var(--panel-2); border: 1px solid var(--border); color: var(--text); padding: 0 8px; min-height: 36px; border-radius: 6px; font-size: 13px; min-width: 60px; font-family: var(--font); }
    .btn-buy { flex: 1; background: #f7f8f8; color: #08090a; border: 1px solid rgba(255,255,255,0.1); padding: 0 14px; min-height: 36px; border-radius: 6px; font-weight: 600; font-size: 13.5px; cursor: pointer; font-family: var(--font); }
    .btn-buy:hover { filter: brightness(0.92); }
    .orders-section { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    .orders-section h3 { font-size: 13px; font-weight: 600; padding: 12px 16px; border-bottom: 1px solid var(--border); }
    .orders-list { display: flex; flex-direction: column; }
    .order-item { padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13.5px; }
    .order-item + .order-item { border-top: 1px solid var(--border); }
    .order-item:hover { background: rgba(255,255,255,0.03); }
    .order-id { font-family: var(--mono); color: var(--accent-text); font-size: 12px; }
    .toast-sidecar {
      position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); margin: 0 auto; max-width: 480px;
      background: rgba(14, 14, 17, 0.94);
      -webkit-backdrop-filter: blur(16px) saturate(160%);
      backdrop-filter: blur(16px) saturate(160%);
      border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.55);
      transform: translateY(150%); transition: transform 0.25s ease; z-index: 1000;
    }
    .toast-sidecar.show { transform: translateY(0); }
    .toast-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; font-weight: 600; font-size: 13px; }
    .toast-header > span:first-child { display: inline-flex; align-items: center; gap: 7px; }
    .toast-header > span:first-child::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px rgba(94,106,210,0.9); }
    #toastStatus { font-family: var(--mono); font-size: 12px; color: var(--green); }
    .toast-body { font-size: 13px; color: var(--text-2); line-height: 1.6; }
    .toast-tag { font-family: var(--mono); color: var(--green); background: rgba(76,195,138,0.1); border: 1px solid rgba(76,195,138,0.25); padding: 1px 6px; border-radius: 5px; font-size: 12px; word-break: break-all; }
    a:focus-visible, button:focus-visible, select:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; }
    @media (pointer: coarse) { .switch-mode-btn, .btn-buy, .quantity-select, .nav-link-btn { min-height: 44px; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } .toast-sidecar { transform: none; } .toast-sidecar:not(.show) { display: none; } }
    @media (prefers-reduced-transparency: reduce) { header, .toast-sidecar { -webkit-backdrop-filter: none; backdrop-filter: none; background: #0e0e11; } body::before { display: none; } }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <div class="logo-icon" aria-hidden="true">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      </div>
      <span>Tienda</span>
    </div>
    <a href="/index.html" class="nav-link-btn">Abrir monitor</a>
  </header>

  <div class="hero">
    <div class="eyebrow">Demo · Sidecar proxy</div>
    <h1>Compra sin tocar la app principal</h1>
    <p>Cada orden viaja por el sidecar :3001: traza, mide y protege. Cambia de ruta y compara.</p>
  </div>

  <div class="mode-banner">
    <div class="mode-info">
      <span>Ruta actual</span>
      <span class="badge-proxy" id="modeBadge">sidecar · :3001</span>
    </div>
    <button class="switch-mode-btn" id="btnToggleMode">Usar directa :3000</button>
  </div>

  <div class="container">
    <h2 class="catalog-title">Catálogo</h2>
    <div class="product-grid" id="productGrid">
      <div style="color: var(--text-2); grid-column: 1/-1; font-size: 13.5px;">Cargando catálogo…</div>
    </div>

    <div class="orders-section">
      <h3>Órdenes</h3>
      <div class="orders-list" id="ordersList">
        <div style="color: var(--text-2); font-size: 13.5px; padding: 10px 16px;">Sin órdenes todavía.</div>
      </div>
    </div>
  </div>

  <div class="toast-sidecar" id="sidecarToast" role="status" aria-live="polite">
    <div class="toast-header">
      <span>Sidecar</span>
      <span id="toastStatus">HTTP —</span>
    </div>
    <div class="toast-body" id="toastContent">Procesando…</div>
  </div>

  <script>
    let useSidecar = true;
    let SIDECAR_URL = 'http://localhost:3001';
    let MAIN_APP_URL = 'http://localhost:3000';

    const productGrid = document.getElementById('productGrid');
    const ordersList = document.getElementById('ordersList');
    const btnToggleMode = document.getElementById('btnToggleMode');
    const modeBadge = document.getElementById('modeBadge');
    const sidecarToast = document.getElementById('sidecarToast');
    const toastStatus = document.getElementById('toastStatus');
    const toastContent = document.getElementById('toastContent');

    const productEmojis = { 101: '💻', 102: '🖥️', 103: '⌨️', 104: '🖱️' };

    function getBaseUrl() { return useSidecar ? SIDECAR_URL : MAIN_APP_URL; }

    btnToggleMode.addEventListener('click', () => {
      useSidecar = !useSidecar;
      if (useSidecar) {
        modeBadge.textContent = 'sidecar · :3001';
        modeBadge.style.background = ''; modeBadge.style.color = ''; modeBadge.style.borderColor = '';
        btnToggleMode.textContent = 'Usar directa :3000';
      } else {
        modeBadge.textContent = 'directa · :3000';
        modeBadge.style.background = 'rgba(245, 165, 36, 0.1)';
        modeBadge.style.color = '#f5a524';
        modeBadge.style.borderColor = 'rgba(245, 165, 36, 0.3)';
        btnToggleMode.textContent = 'Usar sidecar :3001';
      }
      loadProducts();
    });

    async function loadProducts() {
      try {
        const res = await fetch(`${getBaseUrl()}/api/products`);
        const result = await res.json();
        const traceId = res.headers.get('x-trace-id') || 'Sin Trace-ID (directa)';
        const latency = res.headers.get('x-sidecar-latency-ms') || '—';
        showToast(res.status, `<strong>GET /api/products</strong><br>Traza: <span class="toast-tag">${traceId}</span><br>Latencia: ${latency} ms`);
        if (result.success && result.data) renderProducts(result.data);
      } catch (e) {
        productGrid.innerHTML = `<div style="color: #ff6369; grid-column: 1/-1;">Error cargando productos. Verifica los servicios.</div>`;
      }
    }

    function renderProducts(products) {
      productGrid.innerHTML = '';
      products.forEach(p => {
        const emoji = productEmojis[p.id] || '📦';
        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
          <div>
            <div class="product-emoji" aria-hidden="true">${emoji}</div>
            <div class="product-name">${p.name}</div>
            <div class="product-price">$${p.price.toFixed(2)}</div>
            <div class="product-stock">Stock: <strong>${p.stock}</strong></div>
          </div>
          <div class="card-actions">
            <select class="quantity-select" id="qty-${p.id}" aria-label="Cantidad">
              <option value="1">1</option><option value="2">2</option><option value="3">3</option>
            </select>
            <button class="btn-buy" onclick="buyProduct(${p.id})">Comprar</button>
          </div>`;
        productGrid.appendChild(card);
      });
    }

    async function buyProduct(productId) {
      const qtySelect = document.getElementById(`qty-${productId}`);
      const quantity = parseInt(qtySelect.value, 10);
      try {
        const res = await fetch(`${getBaseUrl()}/api/orders`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ productId, quantity })
        });
        const data = await res.json();
        const traceId = res.headers.get('x-trace-id') || 'Sin Trace-ID (directa)';
        if (res.ok && data.success) {
          showToast(res.status, `<strong>Orden ${data.order.id}</strong><br>${data.order.productName} ×${data.order.quantity}<br>Traza: <span class="toast-tag">${traceId}</span>`);
          addOrderToHistory(data.order);
          loadProducts();
        } else {
          showToast(res.status, `<strong style="color: #ff6369;">Error:</strong> ${data.error || data.message || 'Falló la petición'}<br>${data.sidecarNotice ? `<em>${data.sidecarNotice}</em>` : ''}`);
        }
      } catch (err) { showToast(500, `<span style="color: #ff6369;">Error de red</span>`); }
    }

    function addOrderToHistory(order) {
      if (ordersList.textContent.includes('Sin órdenes')) ordersList.innerHTML = '';
      const item = document.createElement('div');
      item.className = 'order-item';
      item.innerHTML = `<div><span class="order-id">${order.id}</span> · <strong>${order.productName}</strong> ×${order.quantity}</div>
        <div><span style="color: var(--green); font-weight: 600; font-variant-numeric: tabular-nums;">$${order.total.toFixed(2)}</span></div>`;
      ordersList.prepend(item);
    }

    let toastTimeout;
    function showToast(status, htmlMsg) {
      toastStatus.textContent = `HTTP ${status}`;
      toastStatus.style.color = status < 400 ? 'var(--green)' : '#ff6369';
      toastContent.innerHTML = htmlMsg;
      sidecarToast.classList.add('show');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => sidecarToast.classList.remove('show'), 4500);
    }

    loadProducts();
  </script>
</body>
</html>
